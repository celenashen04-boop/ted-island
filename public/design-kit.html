<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Design Kit · CHI Island</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/design-kit.css">
</head>
<body class="design-page">
  <header class="kit-header">
    <div><a class="kit-home" href="/">CHI Island</a><h1>Design Kit</h1></div>
    <div class="kit-actions">
      <a id="preview-kit" class="primary" href="/?design=preview" target="_blank" rel="noopener">Preview in game</a>
      <button id="apply-kit" class="secondary" type="button">Apply in this browser</button>
      <button id="export-kit" class="secondary" type="button">Export kit</button>
      <label class="secondary kit-import">Import kit<input id="import-kit" type="file" accept="application/json,.json"></label>
    </div>
  </header>
  <main class="kit-main">
    <p id="kit-status" role="status">Loading your local draft…</p>
    <p id="kit-error" role="alert"></p>
    <div id="kit-editor" hidden>
      <section aria-labelledby="kit-theme-title">
        <h2 id="kit-theme-title">UI kit</h2>
        <div id="kit-theme" class="kit-theme"></div>
      </section>
      <div id="kit-slots"></div>
      <button id="restore-defaults" type="button" class="secondary">Restore default artwork in this browser</button>
    </div>
  </main>
  <script type="module" src="/design-kit.mjs"></script>
</body>
</html>
