<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A shared research garden on a floating island.">
  <title>CHI Island · Research Garden</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/components.css">
  <link rel="stylesheet" href="/ui/motion.css">
  <link rel="stylesheet" href="/ui/onboarding.css">
  <link rel="stylesheet" href="/ui/panels.css">
  <link rel="stylesheet" href="/ui/game.css">
</head>
<body>
  <main class="world" aria-label="CHI Island research garden">
    <button type="button" id="open-world" data-art="world" class="ui-icon-btn round-button world-button" aria-label="Open World View" title="World View">
      <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65">
        <circle cx="12" cy="12" r="9"/>
        <ellipse cx="12" cy="12" rx="4" ry="9"/>
        <path d="M3 12h18"/>
      </svg>
    </button>
    <button type="button" id="browse-plants" class="ui-island-chip" hidden>
      <img id="island-badge" class="ui-badge ui-badge--navigation" alt="">
      <span class="ui-island-chip__text">
        <span class="ui-island-chip__context" id="island-context"></span>
        <span class="ui-island-chip__name" id="island-name"></span>
      </span>
      <span class="ui-icon ui-icon--arrow-right" aria-hidden="true"></span>
    </button>
    <canvas id="map" tabindex="0" aria-label="First-person island. Use W A S D to walk, arrow keys to look, and select a plant to read its research. Press Q to ready an acorn, then tap or click the scene to throw."></canvas>
    <div class="move-stick ui-joystick" id="move-stick" aria-hidden="true"><span class="ui-joystick__handle"></span></div>
    <button type="button" id="seed-mode" data-art="throw" class="ui-icon-btn ui-plus round-button seed-launcher" aria-label="Plant a seed" aria-pressed="false" aria-keyshortcuts="Q" title="Plant a seed (Q)">
      <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M12 5v14M5 12h14"/>
      </svg>
    </button>
    <p id="planting-tip" class="planting-tip instruction-glass" role="status" hidden></p>
    <p class="message instruction-glass" id="message" role="status"></p>
  </main>
  <section id="world-view" class="world-view" aria-label="World View" hidden>
    <button type="button" id="toggle-dashboard" data-art="bridges" class="ui-icon-btn catalog-button round-button dashboard-button" aria-label="Island Access" title="Bridges" aria-expanded="false">
      <svg class="hud-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 15h18M7 5v14M17 5v14M3 10a5 5 0 0 0 4-5c1 4 2.8 6 5 6s4-2 5-6a5 5 0 0 0 4 5M10 10v5m4-5v5"/>
      </svg>
    </button>
    <canvas id="world-map" aria-label="Rotatable map of the CHI islands. Select your home island to return to Player View."></canvas>
    <button type="button" id="home-island" class="ui-world-home" hidden></button>
  </section>
  <dialog id="onboarding" aria-label="CHI Island onboarding"></dialog>
  <dialog id="landscape-required" aria-labelledby="ui-rotate-title" aria-describedby="ui-rotate-body"></dialog>
  <template id="mobile-preview">
    <main class="mobile-preview">
      <iframe title="CHI Island landscape phone preview"></iframe>
    </main>
  </template>
  <script type="module">
    const url = new URL(location.href);
    if (url.searchParams.get('preview') === 'mobile') {
      const preview = document.getElementById('mobile-preview').content.cloneNode(true);
      const stage = preview.querySelector('.mobile-preview');
      const frame = stage.querySelector('iframe');
      url.searchParams.set('preview', 'mobile-game');
      frame.src = url;
      document.body.replaceChildren(stage);
    } else {
      import('/app.mjs');
    }
  </script>
</body>
</html>
