<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHI Island · Growth and bridges</title>
<style>
:root { color-scheme:light; font: 16px/1.5 system-ui,sans-serif; color:#253730; background:#f6f1e4 }
* { box-sizing:border-box }
body { margin:0 }
main { max-width:1120px; margin:auto; padding:clamp(1rem,5vw,4rem) }
h1,h2,h3,p { margin:0 }
h1 { font-size:clamp(2.1rem,6vw,4rem); letter-spacing:-.07em; line-height:1.04 }
h2 { font-size:clamp(1.35rem,3vw,2rem); letter-spacing:-.035em; line-height:1.15 }
h3 { font-size:1.05rem }
header p, section > p, figcaption p { color:#4e6258 }
header p { margin-top:.65rem }
section { margin-top:2.2rem }
section > h2 { margin-bottom:.75rem }
figure { margin:0; overflow:hidden; border:1px solid #cdd4bf; border-radius:1rem; background:#fffdf6 }
figcaption { padding:.85rem 1rem }
figcaption p { font-size:.88rem; margin-top:.2rem }
canvas { display:block; width:100% }
.growth { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,102px),1fr)); gap:.65rem }

.preview-stick {position:absolute;left:1rem;bottom:1rem;width:clamp(48px,10vw,80px);aspect-ratio:1;display:grid;place-items:center;touch-action:none;user-select:none;border:1px solid #fff9ebaa;border-radius:50%;background:#223f3baf}
.preview-stick span {width:42%;aspect-ratio:1;border-radius:50%;background:#fff9eb;pointer-events:none;transform:translate(var(--stick-x,0px),var(--stick-y,0px))}
.scene-label {position:absolute;top:.75rem;left:.75rem;margin:0;padding:.2rem .65rem;border-radius:1rem;background:#223f3be8;color:#fff9eb;white-space:nowrap;pointer-events:none;font-size:.8rem}
.scene [hidden], .controls[hidden] { display:none }
.bridge-description { color:#4e6258; margin-bottom:.65rem }
.maps { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr)); gap:.85rem }
.map canvas { aspect-ratio:1.7; background:#213b49; touch-action:pan-y; cursor:grab }
.map canvas:active { cursor:grabbing }
.home-island { position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;min-height:44px;padding:.35rem .45rem;border:1px solid #fff6d5;border-radius:.55rem;background:#e9d6a6;color:#203431;font-size:.875rem;font-weight:700;box-shadow:0 .28rem .7rem #11252f55;pointer-events:none }
.controls { display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.65rem }
.controls button { padding:.4rem .65rem;border:1px solid #a2b49d;border-radius:2rem;background:#f5f6eb;color:#253730;font:inherit;font-size:.84rem;cursor:pointer }
.controls button[aria-pressed=true] { background:#315646;border-color:#315646;color:#fff9e9 }
button:focus-visible { outline:2px solid #315646;outline-offset:3px }
</style>

<body>

          <button type="button" data-stage="4" aria-pressed="false">Mature tree</button>

<div hidden><button type="button" id="seed-mode"></button><p id="planting-tip"></p></div>
<script>
const islands = [
  {
    id: 0, name: 'Health & Wellbeing',
    description: 'Mental health, stress, wellbeing, social connection',
    x: -2.1, y: .25, z: .35, color: '#a5b76e'
  },
  {
    id: 1, name: 'Sustainability',
    description: 'Environment, sustainable behaviors, communities',
    x: .1, y: .85, z: -1.55, color: '#8ab692'
  },
  {
    id: 2, name: 'Games & Play',
    description: 'Playful interaction, gamification, collaborative experiences',
    x: 2.05, y: -.15, z: .95, color: '#bfbb77'
  }
];

const islandRim = [[-.55,-.37],[.10,-.64],[.62,-.26],[.65,.32],[.12,.62],[-.57,.39]];
const islandLandmarks = [[-.24,.13,.30],[.04,-.12,.54],[.28,.16,.23]];
const islandSpacing = 9;


const plots = [
  [-2.13, 1.7], [-3.10, .55], [-1.08, 2.72], [1.10, 2.72],
  [2.19, 1.76], [3.11, .55], [-2.12, -2.19], [2.13, -2.19]
];

const growthStages=['Seed planted','Sprout','Young plant','Tree','Mature tree'];

function plantStage(growth) {
  return growthStages[growth] ?? growthStages[0];
}

const tileWidth = .85 * Math.sqrt(3);
const tileDepth = .74 * Math.sqrt(3);

function onIsland(x, z, margin = 0) {
  if (!Number.isFinite(x) || !Number.isFinite(z)) return false;
  const inside = (px, pz) => {
    const i = Math.abs(Math.round(px / tileWidth));
    const j = Math.abs(Math.round(pz / tileDepth));
    return i <= 3 && j <= 3 && i + j < 6;
  };
  return inside(x-margin,z-margin) && inside(x-margin,z+margin)
    && inside(x+margin,z-margin) && inside(x+margin,z+margin);
}

function inBuilding(x,z,margin=0) {
  return Math.abs(x) < 1.28+margin && z > -1.3-margin && z < 1.53+margin;
}

function canPlant(x,z) {
  return onIsland(x,z,.10) && !inBuilding(x,z,.10)
    && !(Math.abs(x)<.42 && z>1.43);
}

const bridgeHalfWidth = .65;
const boughRadius = .69;
const boughOval = .86;

function bridgePath(bridge, currentIsland) {
  if (!bridge.span) return null;
  const origin = islands.find(island=>island.id===currentIsland);
  const ends = bridge.span.ends.map(plant=>({...plant, location:islands.find(island=>island.id===plant.island)}));
  if (!origin || ends.length!==2 || ends.some(end=>!end.location)) return null;
  const [first,last] = ends.map(end=>end.location);
  const lengthBetweenIslands = Math.hypot(last.x-first.x,last.z-first.z);
  if (!lengthBetweenIslands) return null;
  const dx = (last.x-first.x)/lengthBetweenIslands;
  const dz = (last.z-first.z)/lengthBetweenIslands;
  const endpoints = ends.map(({island,x,z,location},index)=>{
    const sign=index===0?1:-1;
    let distance=0;
    while(onIsland((distance+.05)*dx*sign,(distance+.05)*dz*sign,bridgeHalfWidth+.15))distance+=.05;
    const offsetX=(location.x-origin.x)*islandSpacing;
    const offsetZ=(location.z-origin.z)*islandSpacing;
    const y=(location.y-origin.y)*islandSpacing;
    return {island,x:offsetX+distance*dx*sign,z:offsetZ+distance*dz*sign,y:y+.06,
      tree:{x:offsetX+x,y,z:offsetZ+z}};
  });
  const [start,end] = endpoints;
  const length = Math.hypot(end.x-start.x,end.z-start.z);
  return {
    endpoints,length,
    point(distance,offset=0) {
      const t=distance/length;
      return [start.x+dx*distance-dz*offset,
        start.y+(end.y-start.y)*t+.35*Math.sin(Math.PI*t),
        start.z+dz*distance+dx*offset];
    },
    locate(x,z) {
      return {distance:(x-start.x)*dx+(z-start.z)*dz,offset:(z-start.z)*dx-(x-start.x)*dz};
    }
  };
}

function boughCrown(distance, length) {
  return .24*Math.sin(Math.PI*distance/length);
}

function bridgeSurfaceHeight(path,distance,offset) {
  const crossSection = Math.sqrt(Math.max(0,1-(offset/boughRadius)**2));
  return path.point(distance)[1]+boughCrown(distance,path.length)-boughRadius*boughOval*(1-crossSection);
}

function traceOakConnection(path,index,growth,joined,drawBough) {
  if(growth<2)return;
  const end=path.endpoints[index], sign=index===0?1:-1;
  const anchor=index===0?0:path.length;
  const bark=['#977451','#ac885f','#876647','#806047'];
  const moss=['#aaba70','#b3be79','#92a15e','#819658'];
  const thickness=[0,0,.062,.145,.34][growth];
  const strands=growth===2?1:growth===3?2:3;
  for(let strand=0;strand<strands;strand++){
    const main=joined && strand===0;
    const radius=main?boughRadius:thickness*(1-strand*.075);
    const extent=main?.5:joined?.625:[0,0,0,.095,.41][growth];
    const curve=t=>{
      const distance=anchor+sign*t*path.length;
      if(main){
        const point=path.point(distance);
        point[1]+=boughCrown(distance,path.length)-radius*boughOval;
        return point;
      }
      const phase=(t*1.18+strand/3+index*.08)*Math.PI*2;
      const offset=Math.cos(phase)*(.33+.48*Math.sin(Math.PI*t));
      const point=path.point(distance,sign*offset);
      point[1]+=.38*Math.sin(Math.PI*t)+.19*Math.sin(phase)-(joined?.45:.12);
      return point;
    };
    const start=curve(0);
    const base=[end.tree.x,end.tree.y+[0,0,.23,.38,.52][growth]+strand*.03,end.tree.z];
    const rootReach=growth===2?.44:1;
    const root=Array.from({length:9},(_,step)=>{
      const t=rootReach*step/8;
      return base.map((value,axis)=>value+(start[axis]-value)*t+(axis===1?.16*Math.sin(Math.PI*t):0));
    });
    drawBough(root,t=>radius*(extent?.43+.57*t:.9-.56*t),bark);
    if(!extent)continue;
    const segments=Math.ceil(extent*38);
    const limbs=Array.from({length:segments+1},(_,step)=>curve(extent*step/segments));
    drawBough(limbs,t=>main?radius:radius*(1-.73*t**5),bark);
    for(let t=.045+strand*.025;t<extent-.036;t+=.09){
      const patch=Array.from({length:7},(_,step)=>{
        const point=curve(t+step*.005);
        if(main){
          const distance=anchor+sign*(t+step*.005)*path.length;
          const edge=path.point(distance,sign*.40);
          point[0]=edge[0];point[2]=edge[2];point[1]+=radius*.64;
        }else point[1]+=radius*.64;
        return point;
      });
      drawBough(patch,t=>Math.max(.032,radius*.55*Math.sin(Math.PI*t)**.52),moss);
    }
    if(growth!==4 || main)continue;
    for(const t of [.19+strand*.018,.41+strand*.024]){
      if(t+.055>extent)continue;
      const fork=Array.from({length:12},(_,step)=>{
        const s=step/11;
        const point=curve(t+s*.055);
        const curl=Math.sin(s*Math.PI*.76)*.50;
        point[0]+=sign*curl;point[2]+=sign*curl*.66;
        point[1]-=Math.sin(s*Math.PI*.62)*.55;
        return point;
      });
      drawBough(fork,t=>.135*(1-.61*t**4),bark);
    }
  }
}

function createScene(canvas, { onPlant, onLanding, onThrowRequest, onCross=()=>{}, onBridgeLocked=()=>{}, artwork = new Map() }) {
  let plants = [];
  const keys = new Set();
  const spawn={x:0,z:3.65,yaw:0,pitch:-.15};
  let {x,z,yaw,pitch}=spawn;
  let feet=0, verticalSpeed=0, grounded=true, eye=1.05;
  let inspecting=false;
  const eyeHeight=1.05, bodyHeight=1.12, radius=.13, maxStep=.25;
  const near=.055, slingY=.75;
  const focalLength=(width,height)=>Math.max(height*.77,width*.48);
  const colliders=[];

  function collider(x,y,z,w,h,d){
    colliders.push({
      left:origin[0]+x-w/2,right:origin[0]+x+w/2,
      back:origin[2]+z-d/2,front:origin[2]+z+d/2,
      bottom:origin[1]+y,top:origin[1]+y+h
    });
  }

  function solidBox(x,y,z,w,h,d,color,top=color){
    box(x,y,z,w,h,d,color,top);
    collider(x,y,z,w,h,d);
  }
  let last=0, flight=null, throwing=false, pull=null;
  let plantHits=[], cursor=null;
  const reducedMotion=window.matchMedia?.('(prefers-reduced-motion: reduce)');
  const throwButton=document.getElementById('seed-mode');
  const plantingTip=document.getElementById('planting-tip');
  const moveStick=document.getElementById('move-stick');
  const movement={side:0,ahead:0};
  let stickId=null;
  const canvasReady=()=>!inspecting && canvas===document.activeElement && !document.querySelector('dialog[open]');
  const clamp=(value,min,max)=>Math.max(min,Math.min(max,value));
  const ctx = canvas.getContext('2d');
  const faces = [];
  const outline=[
    [-3.5,-2.5],[-3.5,2.5],[-2.5,2.5],[-2.5,3.5],
    [2.5,3.5],[2.5,2.5],[3.5,2.5],[3.5,-2.5],
    [2.5,-2.5],[2.5,-3.5],[-2.5,-3.5],[-2.5,-2.5]
  ];
  let currentIsland=null, distantFaces=[], distantLabels=[];
  let bridges=[], bridgeFaces=[], visiblePlants=[], nextBridgeNotice=0, fallLimit=-8;
  let origin, seed = 417;
  const random = () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
  const pick = list => list[Math.floor(random()*list.length)];
  const sand = '#ecc5a6', cream = '#ffdab5', terracotta = '#b97260';
  const moss = ['#a6ad66','#919c59','#b5b572','#829251'];
  const rocks = ['#706e7b','#85808a','#a4918d','#8e8180','#9b8b86'];
  const petals = ['#e89c9e','#ffb8ab','#f5a6a6','#ffc8b3'];
  function tint(hex, light) {
    const n = parseInt(hex.slice(1),16);
    const channel = shift => Math.round(Math.max(0,Math.min(255,((n>>shift)&255)*light)));
    return 'rgb('+[channel(16),channel(8),channel(0)].join(',')+')';
  }
  function face(vertices, color, alpha = 1, decal = null, layer = 2, mesh = faces) {
    const [a,b,c] = vertices;
    const u = b.map((v,i)=>v-a[i]), v = c.map((n,i)=>n-a[i]);
    const normal = [u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
    const length = Math.hypot(...normal) || 1;
    const lighting = .82 + .27*(normal[0]*-.45+normal[1]*.8+normal[2]*.39)/length;
    mesh.push({points:vertices.map(p=>p.map((n,i)=>n+origin[i])),normal,color:color && tint(color,lighting),alpha,decal,layer});
  }
  function box(x,y,z,w,h,d,color,top=color,layer=2,mesh=faces) {
    const X=x+w/2, Z=z+d/2, Y=y+h; x-=w/2;z-=d/2;
    const a=[x,y,z], b=[X,y,z], c=[X,y,Z], e=[x,y,Z];
    const A=[x,Y,z], B=[X,Y,z], C=[X,Y,Z], E=[x,Y,Z];
    face([a,b,c,e],color,1,null,layer,mesh);face([A,E,C,B],top,1,null,layer,mesh);
    face([a,A,B,b],color,1,null,layer,mesh);face([b,B,C,c],color,1,null,layer,mesh);
    face([e,c,C,E],color,1,null,layer,mesh);face([a,e,E,A],color,1,null,layer,mesh);
  }
  function arch(x,y,z,r,leg,thickness,depth) {
    const R=r+thickness, spring=y+leg;
    for (const side of [-1,1]) solidBox(x+side*(r+thickness/2),y,z,thickness,leg,depth,sand);
    for(let i=0;i<12;i++){
      const a=i*Math.PI/12,b=(i+1)*Math.PI/12;
      const point=(radius,angle,side)=>[x+radius*Math.cos(angle),spring+radius*Math.sin(angle),z+side*depth/2];
      const [p,q,s,t]=[point(r,a,1),point(R,a,1),point(R,b,1),point(r,b,1)];
      const [P,Q,S,T]=[point(r,a,-1),point(R,a,-1),point(R,b,-1),point(r,b,-1)];
      const color=i%3===1?cream:sand;
      face([p,q,s,t],color);face([P,T,S,Q],color);
      face([q,Q,S,s],color);face([p,t,T,P],'#ffc68e');
    }
  }
  function crystal(x,y,z,rx,ry,rz,color,sides=7,layer=2) {
    const ring=Array.from({length:sides},(_,i)=>[x+rx*Math.cos(i*2*Math.PI/sides),y,z+rz*Math.sin(i*2*Math.PI/sides)]);
    ring.forEach((a,i)=>{
      const b=ring[(i+1)%sides];
      face([a,[x,y+ry,z],b],color,1,null,layer);
      face([a,b,[x,y-ry*.72,z]],color,1,null,layer);
    });
  }
  function branch(a,b,r,color){
    const points=p=>[[p[0]-r,p[1],p[2]-r],[p[0]+r,p[1],p[2]-r],[p[0]+r,p[1],p[2]+r],[p[0]-r,p[1],p[2]+r]];
    const A=points(a),B=points(b);
    for(let i=0;i<4;i++){const j=(i+1)%4;face([A[i],B[i],B[j],A[j]],color);}
  }
  function tree(x,z,size) {
    const fork=[x,.88*size,z];
    branch([x,0,z],fork,.10*size,'#876052');
    collider(x,0,z,.20*size,fork[1],.20*size);
    for(let i=0;i<6;i++){
      const angle=i*2.4, spread=(.38+random()*.45)*size;
      const b=[x+Math.cos(angle)*spread,(1.32+random()*.48)*size,z+Math.sin(angle)*spread];
      branch(fork,b,.046*size,'#8e6054');
      for(let j=0;j<4;j++) crystal(b[0]+(random()-.5)*size*.65,b[1]+random()*.23*size,b[2]+(random()-.5)*size*.65,(.22+random()*.23)*size,(.15+random()*.15)*size,(.21+random()*.22)*size,pick(petals),6);
    }
  }
  function panel(x,y,z,w,h,paint,color=null,alpha=1){
    face([[x-w/2,y,z],[x+w/2,y,z],[x+w/2,y+h,z],[x-w/2,y+h,z]],color,alpha,paint);
  }
  function glyph(symbol, glass) {
    return (g,w,h)=>{
      g.strokeStyle=glass?'#e6edff':'#ffdfbc';g.fillStyle=g.strokeStyle;
      g.lineWidth=3;g.lineJoin='round';g.lineCap='round';
      if(glass){
        const glow=g.createLinearGradient(0,0,w,h);
        glow.addColorStop(0,'rgba(221,209,255,.72)');glow.addColorStop(1,'rgba(158,162,246,.32)');
        g.fillStyle=glow;g.fillRect(0,0,w,h);g.strokeRect(1,1,w-2,h-2);g.fillStyle='#f8f1ff';
      }
      g.save();g.translate(w/2,h*.52);g.scale(.91,.91);
      const line=(...pts)=>{g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();};
      const ring=(x,y,r,start=0,end=2*Math.PI)=>{g.beginPath();g.arc(x,y,r,start,end);g.stroke();};
      if(symbol===0){for(const x of [-14,0,14]){ring(x,-8,4);g.beginPath();g.arc(x,10,7,Math.PI,2*Math.PI);g.stroke();}}

  function trajectory(dx,dy){
    const pullDistance=Math.max(1,Math.hypot(dx,dy));

    const speed=1.65+strength*11.95;
    const horizontalSpeed=speed*Math.cos(launchPitch);

    const gravity=9.8, seedRadius=.055, launchDistance=.56;
    const viewport=canvas.getBoundingClientRect();

    const drop=focal>0 ? (slingY-.5)*viewport.height*launchDistance/focal : 0;
    const releaseHeight=eye+Math.sin(pitch)*launchDistance-Math.cos(pitch)*drop;
    const forwardOffset=Math.cos(pitch)*launchDistance+Math.sin(pitch)*drop;
    const fromX=x+Math.sin(yaw)*forwardOffset,fromZ=z-Math.cos(yaw)*forwardOffset;

    const point=t=>[fromX+vx*t,releaseHeight+lift*t-gravity*t*t/2,fromZ+vz*t];
    const timeToHeight=y=>(lift+Math.sqrt(Math.max(0,lift*lift+2*gravity*(releaseHeight-y))))/gravity;

    const [tx,,tz]=point(groundTime);

    const limit=hitsGround?groundTime:timeToHeight(-3.6);

    // Sweep between consecutive prediction samples so thin features still register a hit.
    const samples=[{time:0,position:point(0)}];
    while(samples.at(-1).time<limit){
      const previous=samples.at(-1);
      const time=Math.min(limit,previous.time+1/60);
      const position=point(time);
      let hit=null;
      for(const box of colliders){
        const candidate=sweepBox(previous.position,position,box,seedRadius);
        if(candidate&&(!hit||candidate.fraction<hit.fraction))hit=candidate;

      if(hit){
        const duration=previous.time+(time-previous.time)*hit.fraction;
        const center=point(duration);

  function drawPlant(project,plant,scale,now) {
    const ground=plant.y??0;
    const [sx,sy]=project([plant.x,ground+.016,plant.z]);
    const tall=plantSize(plant)*scale;
    const sprite=artwork.get(['seed','sprout','young','tree','mature'][plant.growth]);
    const spriteWidth=sprite ? Math.min(tall*2,tall*sprite.width/sprite.height) : 0;
    const seedY=.105+(reducedMotion?.matches?0:Math.sin(now*.003+plant.x*2+plant.z)*.038);
    const [seedX,seedScreenY]=project([plant.x,ground+seedY,plant.z]);

    ctx.beginPath();ctx.ellipse(0,0,.12*scale*soilSize,.055*scale*soilSize,0,0,Math.PI*2);
    ctx.fillStyle='#715642';ctx.fill();

    }else if(sprite){

    }else{
      drawOak(tall,plant.growth);

    }
    const centerX=plant.growth?sx:seedX;
    const top=plant.growth?sy-tall*1.19:seedScreenY-clamp(.061*scale,5,24)*1.45;
    const halfWidth=Math.max(12,plant.growth ? (spriteWidth/2 || tall*.60) : .078*scale);

    }
  }

  function overlaps(box,px,pz){
    return px+radius>box.left && px-radius<box.right
      && pz+radius>box.back && pz-radius<box.front;
  }

  function bridgeFloorAt(px,pz,ceiling){
    let floor=-Infinity;
    for(const {path,canCross,open} of bridges){
      if(!open || !canCross)continue;
      const {distance,offset}=path.locate(px,pz);
      if(distance<0 || distance>path.length || Math.abs(offset)>bridgeHalfWidth)continue;
      const height=bridgeSurfaceHeight(path,distance,offset);
      if(height<=ceiling && height>floor)floor=height;
    }
    return floor;
  }

  function floorAt(px,pz,ceiling,bridgeFloor=bridgeFloorAt(px,pz,ceiling)){
    let floor=ceiling>=0&&onIsland(px,pz)?Math.max(0,bridgeFloor):bridgeFloor;
    for(const box of colliders){
      if(box.top<=ceiling&&box.top>floor&&overlaps(box,px,pz))floor=box.top;
    }
    return floor;
  }

  function moveTo(px,pz){
    if(!onIsland(px,pz,radius) && bridgeFloorAt(px,pz,Infinity)===-Infinity){
      if(grounded){
        for(const {path,canCross,open} of bridges){
          if(!open || canCross)continue;
          const {distance,offset}=path.locate(px,pz);
          if(distance<0 || distance>path.length || Math.abs(offset)>bridgeHalfWidth)continue;
          if(performance.now()>=nextBridgeNotice){
            nextBridgeNotice=performance.now()+3000;
            onBridgeLocked();
          }
          break;
        }
      }
      return;
    }
    let step=feet;
    if(grounded){
      const bridgeFloor=bridgeFloorAt(px,pz,feet+maxStep);
      const floor=floorAt(px,pz,feet+maxStep,bridgeFloor);
      step=floor===bridgeFloor&&floor>=feet-maxStep?floor:Math.max(feet,floor);
    }
    for(const box of colliders){
      if(box.top>step+.001 && box.bottom<step+bodyHeight && overlaps(box,px,pz))return;
    }
    x=px;z=pz;feet=step;
  }

  function walk(dt){
    if(canvasReady()){
      const side=Number(keys.has('KeyD'))-Number(keys.has('KeyA'))+movement.side;
      const ahead=Number(keys.has('KeyW'))-Number(keys.has('KeyS'))+movement.ahead;
      yaw+=(Number(keys.has('ArrowRight'))-Number(keys.has('ArrowLeft')))*dt*1.8;
      pitch=clamp(pitch+(Number(keys.has('ArrowUp'))-Number(keys.has('ArrowDown')))*dt*1.6,-1.33,1.16);
      if(side||ahead){
        const speed=dt*2.65/Math.max(1,Math.hypot(side,ahead));
        moveTo(x+(Math.sin(yaw)*ahead+Math.cos(yaw)*side)*speed,z);
        moveTo(x,z+(-Math.cos(yaw)*ahead+Math.sin(yaw)*side)*speed);

    else feet=nextFeet;

    if(grounded){

        if(!open || !canCross)continue;
        const local=path.endpoints[0].island===currentIsland?0:1;
        const far=path.endpoints[1-local];
        const {distance,offset}=path.locate(x,z);
        const endDistance=local===0?path.length:0;
        if(Math.abs(distance-endDistance)>.35 || Math.abs(offset)>bridgeHalfWidth)continue;
        const island=islands.find(entry=>entry.id===far.island);
        const source=islands.find(entry=>entry.id===currentIsland);
        onCross(far.island,{x:x-(island.x-source.x)*islandSpacing,
          z:z-(island.z-source.z)*islandSpacing,feet:feet-(island.y-source.y)*islandSpacing});

  function draw(now){

    const bounds=canvas.getBoundingClientRect();
    width=bounds.width;height=bounds.height;

      const pixels=clipped.map(screen);
      if(pixels.every(p=>p[0]<0)||pixels.every(p=>p[0]>width)||pixels.every(p=>p[1]<0)||pixels.every(p=>p[1]>height))continue;
      visible.push({item,pixels,layer:item.layer,depth:clipped.reduce((sum,p)=>sum+p[2],0)/clipped.length,

        const w=Math.min(maxSize,maxSize*image.width/image.height);
        const h=w*image.height/image.width;

      }
      const anchor=view(island.position);

      const point=screen(anchor);
      if(point[0]>=0 && point[0]<=width && point[1]>=12 && point[1]<=height-12){
        visible.push({label:island.name,point,layer:-.7,depth:anchor[2]});
      }
    }
    for(const plant of visiblePlants){
      const depth=view([plant.x,(plant.y??0)+.016,plant.z])[2];
      if(depth>.18)visible.push({plant,depth,layer:plant.remote?1.5:2});

      if(image){ctx.drawImage(image,...bounds);continue;}
      if(label){drawIslandLabel(label,point);continue;}
      if(plant){drawPlant(project,plant,focal/depth,now);continue;}
      if(item.color){
        ctx.globalAlpha=item.alpha;ctx.fillStyle=item.color;ctx.beginPath();
        pixels.forEach(([sx,sy],i)=>i?ctx.lineTo(sx,sy):ctx.moveTo(sx,sy));

      const t=clamp((now-flight.start)/1000,0,flight.duration);
      const position=view(flight.point(t));
      if(position[2]>near){

    canvas.classList?.toggle('over-plant',Boolean(clickable));
  }

  function drawTrajectory(arc,view,screen,inFlight){

    ctx.strokeStyle='#89ff75';ctx.lineWidth=1.65;ctx.stroke();

      const [nx,ny,nz]=arc.normal;
      const [x,y,z]=arc.impact;
      const offset=[x+nx*.018,y+ny*.018,z+nz*.018];
      for(const radius of [.20,.29]){
        ctx.beginPath();
        let drawing=false;
        for(let i=0;i<=24;i++){
          const a=i*Math.PI/12;
          const u=Math.cos(a)*radius,v=Math.sin(a)*radius;
          const point=view([offset[0]+(nx?0:u),offset[1]+(ny?0:nx?u:v),offset[2]+(nz?0:v)]);
          if(point[2]<=near){drawing=false;continue;}
          const [sx,sy]=screen(point);
          if(drawing)ctx.lineTo(sx,sy);
          else ctx.moveTo(sx,sy);
          drawing=true;
        }
        ctx.strokeStyle='#143d2a';ctx.lineWidth=4;ctx.stroke();
        ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();

    }
    ctx.restore();
  }

  function drawSling(){
    const centerX=width/2,centerY=height*slingY;
    const sx=centerX+(pull?.dx??0),sy=centerY+(pull?.dy??0);
    ctx.save();
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(centerX-24,centerY+9);ctx.lineTo(sx,sy);ctx.lineTo(centerX+24,centerY+9);
    ctx.strokeStyle='#472d20';ctx.lineWidth=9;ctx.stroke();
    ctx.strokeStyle='#d99a62';ctx.lineWidth=5;ctx.stroke();
    ctx.restore();

  }

  function drawSeed(sx,sy,radius,angle){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(angle);ctx.scale(radius,radius);
    const sprite=artwork.get('seed');
    if(sprite){
      const ratio=sprite.width/sprite.height,w=Math.min(2.2,2.2*ratio),h=w/ratio;
      ctx.drawImage(sprite,-w/2,-h/2,w,h);

    }

    plantPolygon([[-.62,-.28],[-.11,-.33],[.09,.37],[0,1.04],[-.40,.73]],'#d29454');
    plantPolygon([[-.1,-.33],[.66,-.34],[.61,.37],[.38,.77],[0,1.04],[.14,.32]],'#935634');
    plantPolygon([[-.77,-.23],[-.71,-.63],[-.43,-.91],[.03,-1.04],[.49,-.94],
      [.73,-.62],[.78,-.27],[.43,-.15],[-.38,-.14]],'#74543b');
    plantPolygon([[-.71,-.63],[-.43,-.91],[.03,-1.04],[.49,-.94],[.73,-.62],[.13,-.5],[-.43,-.48]],'#a47c51');

  function look(dx,dy){
    yaw+=dx*.0035;

  let pointer=null, traveled=0, lastPointer=null;

    const items=islands.map(island=>({...island,position:rotate(island)})).sort((a,b)=>a.position.z-b.position.z);
    const center=items.reduce((mid,{position})=>({
      x:mid.x+position.x/items.length,y:mid.y+position.y/items.length,z:mid.z+position.z/items.length
    }),{x:0,y:0,z:0});
    const project=({x,y,z})=>[width/2+(x-center.x)*scale,
      height*.48+((z-center.z)*Math.sin(pitch)-(y-center.y)*Math.cos(pitch))*scale];
    const path=(points,color)=>{
      ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.closePath();ctx.fillStyle=color;ctx.fill();
    };
    const oaks=new Map();
    for(const bridge of bridges){
      const start=items.find(item=>item.id===home),end=items.find(item=>item.id===bridge.destination);
      if(!start||!end)continue;
      const route=bridgePath(bridge,home);
      if(!route)continue;
      const [ax,ay]=project(start.position),[bx,by]=project(end.position);
      const length=Math.hypot(bx-ax,by-ay)||1;
      const lane=bridge.lane??0;
      const mapPoint=([x,y,z])=>{
        const [px,py]=project(rotate({
          x:start.x+x/islandSpacing,y:start.y+y/islandSpacing,z:start.z+z/islandSpacing
        }));
        const along=route.locate(x,z).distance/route.length;
        const separation=lane*Math.sin(Math.PI*Math.max(0,Math.min(1,along)));
        return [px-(by-ay)/length*separation,py+(bx-ax)/length*separation];
      };
      const mapBough=(points,thickness,colors)=>{
        const projected=points.map(mapPoint);
        const stroke=(color,weight,raise=0)=>{
          ctx.strokeStyle=color;
          ctx.lineCap='round';
          for(let i=1;i<projected.length;i++){
            const [x1,y1]=projected[i-1], [x2,y2]=projected[i];
            ctx.lineWidth=Math.max(.55,thickness((i-.5)/(projected.length-1))*scale/islandSpacing*weight);
            ctx.beginPath();ctx.moveTo(x1,y1-raise);ctx.lineTo(x2,y2-raise);ctx.stroke();
          }
        };
        stroke(colors[2],3);
        stroke(colors[1],1.55,.7);
      };
      for(const [index,{island,tree}] of route.endpoints.entries()){
        traceOakConnection(route,index,bridge.span.growth,bridge.open,mapBough);
        if(bridge.span.growth>=3)oaks.set(island,mapPoint([tree.x,tree.y,tree.z]));
      }
    }
    for(const island of items){
      const image=artwork.get('island-'+island.id);
      if(image){
        const [x,y]=project(island.position);
        const w=Math.min(scale*1.65,scale*1.9*image.width/image.height);
        const h=w*image.height/image.width;
        ctx.drawImage(image,x-w/2,y-h*.35,w,h);
        targets.push({id:island.id,polygons:[[[x-w/2,y-h*.35],[x+w/2,y-h*.35],[x+w/2,y+h*.65],[x-w/2,y+h*.65]]]});
        continue;
      }
      const tile=(x,z,y)=>project(rotate({x:island.x+x,y:island.y+y,z:island.z+z}));
      const edge=islandRim.map(([x,z])=>tile(x,z,0));
      const bottom=tile(0,0,-1.0);
      const sides=edge.map((point,index)=>[point,edge[(index+1)%edge.length],bottom]);
      sides.forEach((side,index)=>path(side,index%2?'#70605e':'#8b7470'));
      path(edge,island.color);
      const polygons=[...sides,edge];
      targets.push({id:island.id,polygons});
      for(const [x,z,y] of islandLandmarks){
        const base=tile(x,z,0),top=tile(x,z,y);
        ctx.strokeStyle='#e4ceb0';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(...base);ctx.lineTo(...top);ctx.stroke();
        polygons.push([[top[0]-4,top[1]-3],[top[0]+4,top[1]-3],[base[0]+4,base[1]+3],[base[0]-4,base[1]+3]]);
      }
      const oak=oaks.get(island.id);
      if(oak){
        const [x,y]=oak;
        ctx.strokeStyle='#846448';ctx.lineWidth=4;ctx.lineCap='round';
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-13);ctx.stroke();
        for(const [dx,dy,w,h,color] of [[-6,-14,7,4,'#8da25a'],[6,-13,7,4,'#97ab64'],[0,-17,9,6,'#bac67b']]){
          ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x+dx,y+dy,w,h,0,0,Math.PI*2);ctx.fill();
        }
      }
    }
    const labels=[];
    const homeEntry=items.find(island=>island.id===home);
    homeButton.hidden=!homeEntry;
    for(const island of items){
      const [x,y]=project({...island.position,y:island.position.y+1.02});
      ctx.font='600 14px system-ui';
      const isHome=island.id===home;
      const h=isHome?44:23;
      const w=Math.min(width-16,ctx.measureText(island.name).width+(isHome?52:18));
      const left=Math.max(8,Math.min(width-w-8,x-w/2));
      let top=Math.max(8,Math.min(height-h-8,y-20));
      while(labels.some(label=>left<label.left+label.w+4&&left+w+4>label.left&&top<label.top+label.h+4&&top+h+4>label.top))top+=h+4;
      labels.push({left,top,w,h});
      if(isHome){
        homeButton.textContent=island.name;
        homeButton.setAttribute('aria-label','Enter '+island.name+', your home island');
        homeButton.style.left=left+'px';
        homeButton.style.top=top+'px';
        homeButton.style.width=w+'px';
        continue;
      }
      ctx.fillStyle='#162c37';
      ctx.beginPath();ctx.roundRect(left,top,w,h,6);ctx.fill();
      ctx.fillStyle='#a2b3b4';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(island.name,left+w/2,top+12,w-10);
    }
  }

  function contains(point,polygon){
    const [x,y]=point;
    let inside=false;
    for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
      const [ax,ay]=polygon[i], [bx,by]=polygon[j];
      if((ay>y)!==(by>y)&&x<(bx-ax)*(y-ay)/(by-ay)+ax)inside=!inside;
    }
    return inside;
  }

  function homeAt(event){
    const rect=canvas.getBoundingClientRect();
    const point=[event.clientX-rect.left,event.clientY-rect.top];
    return targets.findLast(target=>target.polygons.some(polygon=>contains(point,polygon)))?.id===home;
  }

  homeButton.addEventListener('click',enterHome);
  canvas.addEventListener('pointerdown',event=>{
    if(drag || event.button!==0)return;
    drag={id:event.pointerId,x:event.clientX,y:event.clientY,travel:0};
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointermove',event=>{
    if(!drag){canvas.style.cursor=homeAt(event)?'pointer':'';return;}
    if(event.pointerId!==drag.id)return;
    const dx=event.clientX-drag.x, dy=event.clientY-drag.y;
    drag.travel+=Math.hypot(dx,dy);
    drag.x=event.clientX;drag.y=event.clientY;
    if(drag.travel<6)return;
    canvas.style.cursor='grabbing';
    yaw+=dx*.012;
    pitch=Math.max(.22,Math.min(1.20,pitch+dy*.008));
    draw();
  });
  canvas.addEventListener('pointerup',event=>{
    if(event.pointerId!==drag?.id)return;
    const enter=drag.travel<6&&homeAt(event);
    drag=null;
    canvas.style.cursor='';
    if(enter)enterHome();
  });
  canvas.addEventListener('lostpointercapture',event=>{
    if(event.pointerId===drag?.id)drag=null;
    canvas.style.cursor='';
  });
  new ResizeObserver(draw).observe(canvas);
  return {
    update(state){({islands,bridges,home}=state);draw();},
    draw
  };
}
const byId = id => document.getElementById(id);
const artwork = new Map();
const clamp = (value,min,max) => Math.max(min,Math.min(max,value));
const reducedMotion = {matches:true};
const clearPath = () => false;

function renderGrowth(canvas,growth) {
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (!width || !height) return;
  const ratio = Math.min(devicePixelRatio || 1,2);
  canvas.width = Math.round(width*ratio);
  canvas.height = Math.round(height*ratio);
  const ctx = canvas.getContext('2d');
  ctx.setTransform(ratio,0,0,ratio,0,0);
  const sky = ctx.createLinearGradient(0,0,0,height);
  sky.addColorStop(0,'#e9edda');
  sky.addColorStop(1,'#c2cd94');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,width,height);
  function drawSeed(sx,sy,radius,angle){
    ctx.save();ctx.translate(sx,sy);ctx.rotate(angle);ctx.scale(radius,radius);
    const sprite=artwork.get('seed');
    if(sprite){
      const ratio=sprite.width/sprite.height,w=Math.min(2.2,2.2*ratio),h=w/ratio;
      ctx.drawImage(sprite,-w/2,-h/2,w,h);
      ctx.restore();
      return;
    }
    plantPolygon([[-.67,-.34],[.66,-.34],[.61,.37],[.38,.77],[0,1.04],[-.40,.73],[-.64,.34]],'#a86b3e');
    plantPolygon([[-.62,-.28],[-.11,-.33],[.09,.37],[0,1.04],[-.40,.73]],'#d29454');
    plantPolygon([[-.1,-.33],[.66,-.34],[.61,.37],[.38,.77],[0,1.04],[.14,.32]],'#935634');
    plantPolygon([[-.77,-.23],[-.71,-.63],[-.43,-.91],[.03,-1.04],[.49,-.94],
      [.73,-.62],[.78,-.27],[.43,-.15],[-.38,-.14]],'#74543b');
    plantPolygon([[-.71,-.63],[-.43,-.91],[.03,-1.04],[.49,-.94],[.73,-.62],[.13,-.5],[-.43,-.48]],'#a47c51');
    plantPolygon([[-.18,-.95],[-.13,-1.27],[.07,-1.32],[.15,-1.20],[.02,-.97]],'#805c42');
    ctx.restore();
  }

  function plantSize(plant){
    return [.11,.28,.51,.82,1.12][plant.growth] ?? .11;
  }

  function plantPolygon(points,color){
    ctx.beginPath();
    points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
    ctx.closePath();
    ctx.fillStyle=color;
    ctx.fill();
  }

  function oakLeaf(x,y,size,angle,lobed,color){
    ctx.save();
    ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size,size);
    const edge=lobed?[[0,0],[.24,-.22],[.39,-.19],[.52,-.40],[.69,-.33],[.88,-.35],[1,-.12],
      [.87,.11],[.65,.18],[.53,.10],[.34,.22],[.19,.13]]
      :[[0,0],[.22,-.23],[.62,-.32],[1,-.12],[.74,.15],[.37,.22]];
    plantPolygon(edge,color);
    plantPolygon([[0,0],[1,-.12],[.65,.18],[.34,.22]],'#71854d');
    ctx.restore();
  }

  function drawOak(tall,growth){
    ctx.save();
    ctx.scale(tall,tall);
    if(growth<=2){
      const young=growth===2;
      plantPolygon([[-.036,0],[.036,0],[.057,-.66],[.014,-.82],[-.012,-.47]],young?'#8c6244':'#667b46');
      oakLeaf(.014,-.58,.49,-.53,young,'#a8b76b');
      oakLeaf(.012,-.42,.45,3.62,young,'#8fa459');
      if(young){
        oakLeaf(.028,-.27,.32,-.38,true,'#91a55b');
        oakLeaf(.022,-.70,.36,-1.29,true,'#bec780');
      }
    }else{
      const mature=growth===4;
      plantPolygon([[-.17,0],[-.083,-.15],[-.059,-.49],[-.026,-.79],[.061,-.82],
        [.076,-.47],[.086,-.14],[.16,0]],'#936747');
      plantPolygon([[-.17,0],[-.083,-.15],[-.059,-.49],[-.026,-.79],[.014,-.71],[.007,-.30],[-.024,0]],'#76533d');
      plantPolygon([[-.055,-.39],[-.28,-.59],[-.34,-.71],[-.25,-.67],[.01,-.49]],'#856044');
      plantPolygon([[.044,-.46],[.31,-.71],[.38,-.70],[.24,-.53],[.075,-.34]],'#a77650');
      const crown=[
        [-.22,-.7,.24,.19,'#899b55','#acbc69'],
        [.23,-.69,.24,.20,'#81944f','#a0b060'],
        [0,-.83,.30,.20,'#9eae5c','#c0c779']
      ];
      if(mature) crown.unshift([-.38,-.57,.20,.16,'#829450','#a1b261'],
        [.39,-.56,.19,.17,'#879950','#a7b968']);
      for(const [x,y,w,h,shade,light] of crown){
        const outline=[[-.95,.16],[-.92,-.42],[-.53,-.83],[.05,-1],[.65,-.75],[1,-.18],[.75,.49],[.15,.74],[-.59,.65]];
        const facet=points=>points.map(([dx,dy])=>[x+dx*w,y+dy*h]);
        plantPolygon(facet(outline),shade);
        plantPolygon(facet([outline[1],outline[2],outline[3],outline[4],[.48,-.2],[-.35,.14]]),light);
        plantPolygon(facet([[-.35,.14],[.48,-.2],outline[5],outline[6],outline[7]]),mature?'#96a65b':'#a0af61');
      }
    }
    ctx.restore();
  }

  function drawPlant(project,plant,scale,now) {
    const ground=plant.y??0;
    const [sx,sy]=project([plant.x,ground+.016,plant.z]);
    const tall=plantSize(plant)*scale;
    const sprite=artwork.get(['seed','sprout','young','tree','mature'][plant.growth]);
    const spriteWidth=sprite ? Math.min(tall*2,tall*sprite.width/sprite.height) : 0;
    const seedY=.105+(reducedMotion?.matches?0:Math.sin(now*.003+plant.x*2+plant.z)*.038);
    const [seedX,seedScreenY]=project([plant.x,ground+seedY,plant.z]);
    ctx.save();ctx.translate(sx,sy);
    const soilSize=plant.growth?1:.66;
    ctx.beginPath();ctx.ellipse(0,0,.12*scale*soilSize,.055*scale*soilSize,0,0,Math.PI*2);
    ctx.fillStyle='#715642';ctx.fill();
    if(!plant.growth){
      ctx.restore();
      drawSeed(seedX,seedScreenY,clamp(.061*scale,5,24),-.45);
    }else if(sprite){
      ctx.drawImage(sprite,-spriteWidth/2,-tall,spriteWidth,tall);
      ctx.restore();
    }else{
      drawOak(tall,plant.growth);
      ctx.restore();
    }
    const centerX=plant.growth?sx:seedX;
    const top=plant.growth?sy-tall*1.19:seedScreenY-clamp(.061*scale,5,24)*1.45;
    const halfWidth=Math.max(12,plant.growth ? (spriteWidth/2 || tall*.60) : .078*scale);
    if(!plant.remote && clearPath(plant.x,plant.growth?plantSize(plant)*.62:seedY,plant.z)){
      plantHits.push({id:plant.id,left:centerX-halfWidth,right:centerX+halfWidth,top:top-5,bottom:sy+8});
    }
  }

  const scale = Math.min(95,width*.70);
  drawPlant(([,y]) => [width/2,height-15-y*scale],{x:0,z:0,growth},scale,0);
}

const growthGrid = byId('growth-stages');
for (let growth=0;growth<5;growth++) {
  const card = document.createElement('figure');
  const canvas = document.createElement('canvas');
  const label = document.createElement('figcaption');
  label.textContent = plantStage(growth);
  canvas.setAttribute('aria-label', label.textContent);
  card.append(canvas,label);
  growthGrid.append(card);
  new ResizeObserver(() => renderGrowth(canvas,growth)).observe(canvas);
}

const pair = islands.slice(0,2);
const bridge = {destination:1,open:true,canCross:true,progress:100,
  span:{seed:'shared-idea',title:'Shared idea',growth:4,
    ends:[{island:0,x:3,z:-3},{island:1,x:-3,z:3}]}};
const fromOriginal = bridgePath(bridge,0);
const fromAdopted = bridgePath(bridge,1);
for (let index=0;index<2;index++) {
  const path = index===0 ? fromOriginal : fromAdopted;
  const [x,,z] = path.point(index===0?.46:path.length-.46,index===0?.54:-.54);
  Object.assign(bridge.span.ends[index],{x,z});
}
let playerIsland=0;
let previewBridge=bridge;
let selectedDesign='moss', selectedCamera='side', selectedStage=5;
const bridgeDesignNotes={
  braid:'Three oak limbs twist over and under one another, narrowing where they meet.',
  arch:'Two sweeping branches curve across the gap at different heights and cross near the middle.',
  moss:'Rounded oak branches intertwine beneath soft patches of moss.',
  prototype:'Try walking across the Mossy Tangle span used in the prototype.'
};
const mossStageNotes=[
  'A planted acorn rests on each island.',
  'Two leaves emerge on each island.',
  'Short shoots appear on both saplings.',
  'The young oaks begin to reach toward each other.',
  'The mature oaks send thicker, moss-covered branches farther across the gap.',
  'The thick branches meet and weave together into a continuous span.'
];
const canvas=byId('player-reference');
const player = createScene(canvas,{
  onPlant(){}, onLanding(){}, onThrowRequest(){return false;},
  onCross(island,position){
    playerIsland=island;
    drawPlayerStage();
    player.arrive(position);
    byId('player-caption').textContent = 'You walked to '+islands[island].name+'. Turn around to walk back.';
  }
});
function drawPlayerStage() {
  const seed = previewBridge.span.ends.find(end=>end.island===playerIsland);
  player.update([{...seed,id:previewBridge.span.seed,growth:previewBridge.span.growth}],playerIsland,[previewBridge]);
  byId('preview-island').textContent=islands[playerIsland].name;
}
function setPlayerStage(stage,focus=false) {
  selectedStage=stage;
  playerIsland=0;
  const open=stage===5;
  const prototype=selectedDesign==='prototype';
  previewBridge={...bridge,open,canCross:open&&prototype,concept:prototype?null:selectedDesign,
    progress:open?100:50,span:{...bridge.span,growth:Math.min(4,stage)}};
  for (const button of byId('player-stages').querySelectorAll('button')) {
    button.setAttribute('aria-pressed',String(Number(button.dataset.stage)===stage));
    if(button.dataset.stage==='5')button.textContent=prototype?'Joined and walkable':'Intertwined';
  }
  for (const button of byId('bridge-designs').querySelectorAll('button')) {
    button.setAttribute('aria-pressed',String(button.dataset.design===selectedDesign));
  }
  for (const button of byId('bridge-cameras').querySelectorAll('button')) {
    button.setAttribute('aria-pressed',String(button.dataset.camera===selectedCamera));
    if(button.dataset.camera==='junction')button.textContent=stage<=2?'Oak close-up':'Junction close-up';
  }
  byId('bridge-description').textContent=bridgeDesignNotes[selectedDesign];
  byId('bridge-cameras').hidden=prototype;
  byId('move-stick').hidden=!prototype;
  drawPlayerStage();
  player.reset();
  const path=bridgePath(previewBridge,0);
  if(prototype){
    const [x,,z]=path.point(-.18);
    player.arrive({x,z,feet:0});
    player.faceBridge(1);
    byId('player-caption').textContent=open
      ? 'Drag the joystick forward or click the scene and hold W to walk across.'
      : 'The original and adopted trees grow toward each other before the span is walkable.';
    if (focus) canvas.focus({preventScroll:true});
  }else{
    const to=path.point(path.length*.52);
    const from=selectedCamera==='side'?path.point(path.length*.34,path.length*.91)
      :selectedCamera==='junction'?path.point(path.length*.39,5.9):path.point(-.20,-.28);
    from[1]+=selectedCamera==='side'?6.2:selectedCamera==='junction'?3.25:1.1;
    if(selectedCamera!=='side')to[1]+=.85;
    if(selectedCamera==='junction' && stage<=2){
      const {x,y,z}=path.endpoints[0].tree;
      from.splice(0,3,x+1.04,y+.68,z+1.64);
      to.splice(0,3,x,y+.24,z);
    }
    player.inspect(from,to);
    byId('player-caption').textContent=selectedDesign==='moss'?mossStageNotes[stage]
      :open?'The two oaks’ branches meet and intertwine.': 'The paired plants grow together before the branches join.';
  }
}
byId('player-stages').addEventListener('click',event=>{
  if (event.target.matches('button')) setPlayerStage(Number(event.target.dataset.stage),true);
});
byId('bridge-designs').addEventListener('click',event=>{
  const design=event.target.dataset.design;
  if(!design)return;
  selectedDesign=design;
  setPlayerStage(selectedStage,true);
});
byId('bridge-cameras').addEventListener('click',event=>{
  const camera=event.target.dataset.camera;
  if(!camera)return;
  selectedCamera=camera;
  setPlayerStage(selectedStage);
});
setPlayerStage(5);
const noop = () => {};
const one = createWorld(byId('one-map'),artwork,byId('one-home'),noop);
const four = createWorld(byId('four-map'),artwork,byId('four-home'),noop);
const updateMap = (map,bridges) => map.update({islands:pair,bridges,home:0});

function setOne(open) {
  byId('open-bridge').setAttribute('aria-pressed',String(open));
  byId('building-bridge').setAttribute('aria-pressed',String(!open));
  updateMap(one,[{...bridge,open,progress:open?100:50}]);
}
function setFour(concept) {
  byId('current-design').setAttribute('aria-pressed',String(!concept));
  byId('four-concept').setAttribute('aria-pressed',String(concept));
  byId('four-caption').textContent = concept
    ? 'Concept only. Four separate spans between the same two islands.'
    : 'Four shared seeds contribute to one bridge for this island pair.';
  updateMap(four,concept?[-35,-12,12,35].map(lane=>({...bridge,lane})):[bridge]);
}
byId('open-bridge').addEventListener('click',()=>setOne(true));
byId('building-bridge').addEventListener('click',()=>setOne(false));
byId('current-design').addEventListener('click',()=>setFour(false));
byId('four-concept').addEventListener('click',()=>setFour(true));
setOne(true);
setFour(false);
